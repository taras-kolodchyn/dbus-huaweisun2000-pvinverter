services:
  modbus-sim:
    image: python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - MODBUS_SIM_PORT=15020
      - MODBUS_SIM_UNIT=1
    command: ["bash", "-lc", "pip install 'pymodbus>=2,<3' && python docker/modbus_sim.py"]

  venus:
    image: victronenergy/venus-docker:latest@sha256:41432b730af7e3cb1268713e1f17bf12561d1b662f1b82520b52a9daafdd2882
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - DBUS_HUAWEISUN2000_MODBUS_HOST=modbus-sim
      - DBUS_HUAWEISUN2000_MODBUS_PORT=15020
      - DBUS_HUAWEISUN2000_MODBUS_UNIT=1
      - DBUS_HUAWEISUN2000_ONESHOT=5000
      - VENUS_SIMULATION=a
      - VENUS_SIMULATION_FLAGS=--with-pvinverter
    command: ["bash", "-lc", "/workspace/docker/run_venus_with_driver.sh"]
    depends_on:
      - modbus-sim
