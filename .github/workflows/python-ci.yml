name: Python CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare toolcache for act
        if: ${{ env.ACT }}
        run: |
          echo "RUNNER_TOOL_CACHE=$PWD/.toolcache" >> $GITHUB_ENV
          echo "RUNNER_TEMP=$PWD/.tmp" >> $GITHUB_ENV
          mkdir -p "$PWD/.toolcache" "$PWD/.tmp"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' 'pip-audit==2.10.1'

      - name: Audit installed dependencies
        run: python -m pip_audit --local --skip-editable --format=json --output=pip-audit.json

      - name: Lint with black
        run: black --check .

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests with coverage
        run: pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=xml --cov-report=term

      - name: Install/uninstall smoke test
        if: ${{ !env.ACT }}
        run: bash docker/test_install_uninstall.sh

      - name: Docker Compose smoke test
        if: ${{ !env.ACT }}
        run: |
          docker compose -f docker-compose.dev.yml -f docker-compose.install-test.yml up --build --abort-on-container-exit --exit-code-from venus

      - name: Collect Docker diagnostics
        if: ${{ failure() && !env.ACT }}
        run: |
          mkdir -p ci-artifacts
          docker compose -f docker-compose.dev.yml -f docker-compose.install-test.yml logs --no-color > ci-artifacts/compose.log 2>&1
          docker compose -f docker-compose.dev.yml -f docker-compose.install-test.yml ps --all > ci-artifacts/compose-status.txt 2>&1

      - name: Clean up Docker Compose
        if: ${{ always() && !env.ACT }}
        run: docker compose -f docker-compose.dev.yml -f docker-compose.install-test.yml down --volumes --remove-orphans

      - name: Upload CI reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports
          path: |
            coverage.xml
            pip-audit.json
            ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check for README and LICENSE
        run: |
          test -f README.md
          test -f LICENSE

  release:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Get version from git tag
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Verify package version matches git tag
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["VERSION"]
          actual = version("dbus-huaweisun2000-pvinverter")
          if actual != expected:
              raise SystemExit(
                  f"Package version {actual!r} does not match release tag {expected!r}"
              )
          PY

      - name: Create Release ZIP
        run: |
          ARCHIVE_NAME="dbus-huaweisun2000-pvinverter-v${VERSION}.zip"
          LATEST_ARCHIVE_NAME="dbus-huaweisun2000-pvinverter.zip"
          git ls-files -z | grep -vz '\.zip$' | xargs -0 zip -qr "$ARCHIVE_NAME"
          cp "$ARCHIVE_NAME" "$LATEST_ARCHIVE_NAME"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: true
          files: |
            dbus-huaweisun2000-pvinverter-v${{ env.VERSION }}.zip
            dbus-huaweisun2000-pvinverter.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release download links
        run: |
          VERSIONED_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/dbus-huaweisun2000-pvinverter-v${VERSION}.zip"
          LATEST_URL="https://github.com/${{ github.repository }}/releases/latest/download/dbus-huaweisun2000-pvinverter.zip"
          for url in "$VERSIONED_URL" "$LATEST_URL"; do
            for attempt in 1 2 3 4 5; do
              status=$(curl -L -o /dev/null -s -w '%{http_code}' "$url")
              if [ "$status" = "200" ]; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Download URL failed: $url (status $status)"
                exit 1
              fi
              sleep 3
            done
          done
